# =============================================================================
# 实验 02 测试域：lab.local（dnsmasq 声明式配置）
# 作用：在本机 127.0.0.1:5300 起一个「有错误配置」的权威 DNS 服务器——
#       允许任何人做 AXFR 区域传送，用来演示子域枚举与区域传送利用。
# 启动方式见 ../dns_enum.sh（apply 阶段），不要手动改端口，脚本按此文件拉起。
# =============================================================================

# -- 监听与解析 --------------------------------------------------------------
port=5300                      # 高位端口免 sudo；53 需要 root，且与系统服务冲突
bind-interfaces                # 只绑定显式列出的地址，不去抢其他接口
listen-address=127.0.0.1
no-resolv                      # 不做上游转发：本机就是权威，查不到就是 NXDOMAIN
no-hosts                       # 不读 /etc/hosts，保证记录只来自本配置文件

log-queries                    # 记录每次查询，方便观察工具的探测行为
log-facility=/tmp/hosec02-dnsmasq.log

# -- 权威区配置 --------------------------------------------------------------
auth-server=ns1.lab.local,127.0.0.1     # 对外宣称的 NS 主机与地址
auth-zone=lab.local,127.0.0.0/8        # 声明 lab.local 为权威区（地址范围限定本机网段）
auth-peer=127.0.0.1                    # 只允许本机发起 AXFR（漏洞演示保留，真实事故中常是全放行）
auth-soa=2026101301,hostmaster.lab.local   # SOA 序列号（日期格式），区数据变更时递增

# -- 区记录（5 个子域，即验收清单）-------------------------------------------
host-record=ns1.lab.local,127.0.0.1     # NS 主机本身
host-record=www.lab.local,127.0.0.1     # ① 网站
host-record=mail.lab.local,127.0.0.1    # ② 邮件（同时被 MX 指向）
host-record=api.lab.local,127.0.0.1     # ③ 接口服务
host-record=blog.lab.local,127.0.0.1    # ④ 博客
cname=shop.lab.local,www.lab.local      # ⑤ 商城：CNAME 指向 www，演示别名链

mx-host=lab.local,mail.lab.local,10     # 邮件路由：priority 10 → mail
txt-record=lab.local,"v=spf1 -all"      # SPF：声明本域不发邮件（也是枚举工具提取的目标）
